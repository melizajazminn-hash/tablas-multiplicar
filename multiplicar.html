<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 ¡Generador de Tablas Espacial! 🤖</title>
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

  <!-- Estrellas decorativas animadas de fondo -->
  <div class="estrella e1">⭐</div>
  <div class="estrella e2">✨</div>
  <div class="estrella e3">⭐</div>

  <div class="contenedor-principal">
    
    <!-- NUEVO: Texto de bienvenida para los niños -->
    <h1 class="titulo-bienvenida">👋 ¡Hola! ¿Qué tabla queremos aprender hoy?</h1>

    <!-- Panel Superior de Entrada de Datos -->
    <div class="panel-control">
      <input type="text" id="numero-tabla" placeholder="Escribe un número aquí">
      <button class="btn-probar" onclick="generarTablas()">🎮 PROBAR PODER ⚡</button>
    </div>

    <!-- Etiqueta de mensaje para las alertas -->
    <p id="mensaje" class="texto-alerta">¡Escribe tu número de misión arriba!</p>

    <!-- Contenedor vacío donde el JavaScript va a dibujar la tabla -->
    <div id="resultado-tabla" class="contenedor-resultado"></div>

  </div>

  <script src="multiplicar.js"></script>
</body>
</html>
